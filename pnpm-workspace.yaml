packages:
  - frontend
  - portal-cliente-api

nodeLinker: isolated
strictPeerDependencies: false

# Correções de segurança em dependências transitivas (Dependabot/pnpm audit).
# Remover cada entrada quando o pacote pai passar a trazer a versão corrigida.
overrides:
  multer: ^2.4.0 # @nestjs/platform-express fixa 2.2.0 (DoS no upload multipart)
  postcss: ^8.5.23 # next fixa 8.4.31 (leitura de arquivo via sourceMappingURL)
  mysql2: ^3.23.1 # vem pelo prisma CLI; não é usado em runtime (banco é Postgres)

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  core-js: false
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.5'
  - '@better-auth/drizzle-adapter@1.7.5'
  - '@better-auth/kysely-adapter@1.7.5'
  - '@better-auth/memory-adapter@1.7.5'
  - '@better-auth/mongo-adapter@1.7.5'
  - '@better-auth/prisma-adapter@1.7.5'
  - '@better-auth/telemetry@1.7.5'
  - better-auth@1.7.5
