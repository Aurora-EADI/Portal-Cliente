services:

  minio:
    # Tag fixa oficial no Quay; nao usar latest em producao.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-prod
    # Sem publicação de porta no host — acesso apenas pela portal_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - portal_net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # mc existe na imagem validada e evita depender de curl.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    container_name: portal-cliente-migrate
    image: ghcr.io/${GHCR_OWNER}/portal-cliente-migrator:${IMAGE_TAG}
    # Explicitly invoked by the deploy job; regular `up` must not rerun it.
    profiles: [migration]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@172.20.210.68:${DB_PORT:-5432}/${DB_NAME}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks:
      - portal_net

  portal-cliente-api:
    container_name: portal-cliente-api
    image: ghcr.io/${GHCR_OWNER}/portal-cliente-api:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      PORT: 3030
      # PostgreSQL no host fixo da infraestrutura
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@172.20.210.68:${DB_PORT:-5432}/${DB_NAME}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_PROVISIONING_SECRET: ${BETTER_AUTH_PROVISIONING_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # MinIO interno via portal_net
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      # A opcao A faz o proprio servico verificar/criar o bucket no startup.
      # Por isso a API usa as credenciais root, sem duas variaveis duplicadas
      # no .env.prod. O proximo endurecimento independente seria um usuario S3
      # dedicado, provisionado por mc, com politica limitada ao bucket.
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      PROTHEUS_API_KEY: ${PROTHEUS_API_KEY:-}
      # Broker e operado fora desta stack; a URL vem somente do .env.prod.
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-portal.integration.events}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-portal.integration.retry}
      RABBITMQ_DLX_EXCHANGE: ${RABBITMQ_DLX_EXCHANGE:-portal.integration.dlx}
      RABBITMQ_DI_AVERBADA_QUEUE: ${RABBITMQ_DI_AVERBADA_QUEUE:-portal-cliente.dis-averbada.created}
      RABBITMQ_DI_AVERBADA_RETRY_QUEUE: ${RABBITMQ_DI_AVERBADA_RETRY_QUEUE:-portal-cliente.dis-averbada.created.retry.30s}
      RABBITMQ_DI_AVERBADA_DLQ: ${RABBITMQ_DI_AVERBADA_DLQ:-portal-cliente.dis-averbada.created.dlq}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-30000}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-5}
    # Sem publicação de porta no host — roteado pelo Traefik via portal_net
    networks:
      - portal_net
    depends_on:
      minio:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3030/api/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portal_net"
      - "traefik.http.routers.portalcliente-api.rule=Host(`${PORTAL_HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.portalcliente-api.entrypoints=websecure"
      - "traefik.http.routers.portalcliente-api.tls=true"
      - "traefik.http.routers.portalcliente-api.priority=100"
      - "traefik.http.routers.portalcliente-api.service=portalcliente-api"
      - "traefik.http.services.portalcliente-api.loadbalancer.server.port=3030"

  frontend:
    container_name: portal-cliente-frontend
    image: ghcr.io/${GHCR_OWNER}/portal-cliente-frontend:${IMAGE_TAG}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_NEST_API_URL: ${API_URL}
      NEST_API_INTERNAL_URL: http://portal-cliente-api:3030/api
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_AVERBACAO_ATIVA: ${AVERBACAO_ATIVA:-false}
      NEXT_TELEMETRY_DISABLED: 1
    # Sem publicação de porta no host — roteado pelo Traefik via portal_net
    networks:
      - portal_net
    depends_on:
      portal-cliente-api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portal_net"
      - "traefik.http.routers.portalcliente-front.rule=Host(`${PORTAL_HOST}`)"
      - "traefik.http.routers.portalcliente-front.entrypoints=websecure"
      - "traefik.http.routers.portalcliente-front.tls=true"
      - "traefik.http.routers.portalcliente-front.priority=10"
      - "traefik.http.routers.portalcliente-front.service=portalcliente-front"
      - "traefik.http.services.portalcliente-front.loadbalancer.server.port=3000"

networks:
  portal_net:
    external: true

volumes:
  minio_data:
    driver: local
