# ===========================================
# Pipeline CI/CD - Portal Aurora
# GitLab local (Docker) + Shell Runner (Windows/PowerShell)
# ===========================================

stages:
  - build
  - deploy

variables:
  PROJECT_DIR: 'C:\Users\administrator\Documents\Portal_Prod\Portal-Aurora'
  COMPOSE_FILE: docker-compose.prod.yml

# -----------------------------------------------
# Stage: build - Build das imagens Docker
# -----------------------------------------------
build-backend:
  stage: build
  tags:
    - shell
  script:
    - docker compose -f $env:COMPOSE_FILE build backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build-frontend:
  stage: build
  tags:
    - shell
  script:
    - docker compose -f $env:COMPOSE_FILE build frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# -----------------------------------------------
# Stage: deploy - Deploy (manual)
# -----------------------------------------------
deploy-prod:
  stage: deploy
  tags:
    - shell
  script:
    - Set-Location $env:PROJECT_DIR
    - git config --global --add safe.directory ($env:PROJECT_DIR -replace '\\','/')
    - GIT_TERMINAL_PROMPT=0 git -c credential.helper= pull gitlab main
    - docker compose -f docker-compose.prod.yml down
    - docker compose -f docker-compose.prod.yml up -d --build
    - docker compose -f docker-compose.prod.yml ps
    - Write-Host "Deploy producao concluido com sucesso!"
  environment:
    name: production
    url: https://portal.auroraeadi.com.br
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

deploy-staging:
  stage: deploy
  tags:
    - shell
  script:
    - Set-Location $env:PROJECT_DIR
    - git config --global --add safe.directory ($env:PROJECT_DIR -replace '\\','/')
    - GIT_TERMINAL_PROMPT=0 git -c credential.helper= pull gitlab develop
    - docker compose -f docker-compose.dev.yml down
    - docker compose -f docker-compose.dev.yml up -d --build
    - docker compose -f docker-compose.dev.yml ps
    - Write-Host "Deploy staging concluido!"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual
