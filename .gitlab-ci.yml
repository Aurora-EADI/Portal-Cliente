# ===========================================
# Pipeline CI/CD - Portal Aurora
# GitLab local (Docker) + Shell Runner (Windows/PowerShell)
# ===========================================

stages:
  - check
  - build
  - migrate
  - deploy
  - cleanup

variables:
  PROJECT_DIR: 'C:\Users\administrator\Documents\Portal_Prod\Portal-Aurora'
  COMPOSE_FILE: docker-compose.prod.yml

# -----------------------------------------------
# Stage: check - Verificacoes que nao precisam de build
# -----------------------------------------------
# A fonte de verdade do schema Prisma e portal-cliente-api/prisma/schema.prisma;
# frontend/prisma/schema.prisma e copia gerada. Quem editar so a copia quebra
# aqui, antes de gerar dois clients divergentes.
prisma-schema-sync:
  stage: check
  tags:
    - shell
  script:
    - node scripts/sync-prisma.mjs --check
  rules:
    - changes:
        - portal-cliente-api/prisma/schema.prisma
        - frontend/prisma/schema.prisma

# -----------------------------------------------
# Stage: build - Build das imagens Docker
# -----------------------------------------------
build-backend:
  stage: build
  tags:
    - shell
  script:
    - docker compose -f $env:COMPOSE_FILE build backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build-frontend:
  stage: build
  tags:
    - shell
  script:
    - docker compose -f $env:COMPOSE_FILE build frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# -----------------------------------------------
# Stage: migrate - Sincronizar schema do banco
# -----------------------------------------------
migrate-db:
  stage: migrate
  tags:
    - shell
  script:
    - Set-Location $env:PROJECT_DIR
    - docker compose -f $env:COMPOSE_FILE run --rm --no-deps backend npx prisma db push --schema=prisma/postgres/schema.prisma --skip-generate
    - Write-Host "Schema do banco sincronizado com sucesso!"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/prisma/**/*
      when: manual
  allow_failure: true

# -----------------------------------------------
# Stage: deploy - Deploy (manual)
# -----------------------------------------------
deploy-prod:
  stage: deploy
  tags:
    - shell
  script:
    - Set-Location $env:PROJECT_DIR
    - git config --global --add safe.directory ($env:PROJECT_DIR -replace '\\','/')
    - $env:GIT_TERMINAL_PROMPT='0'; git -c credential.helper= pull gitlab main
    - docker compose -f docker-compose.prod.yml down
    - docker compose -f docker-compose.prod.yml up -d
    - docker compose -f docker-compose.prod.yml ps
    - Write-Host "Deploy producao concluido com sucesso!"
  environment:
    name: production
    url: https://portal.auroraeadi.com.br
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

deploy-staging:
  stage: deploy
  tags:
    - shell
  script:
    - Set-Location $env:PROJECT_DIR
    - git config --global --add safe.directory ($env:PROJECT_DIR -replace '\\','/')
    - $env:GIT_TERMINAL_PROMPT='0'; git -c credential.helper= pull gitlab develop
    - docker compose -f docker-compose.dev.yml down
    - docker compose -f docker-compose.dev.yml up -d
    - docker compose -f docker-compose.dev.yml ps
    - Write-Host "Deploy staging concluido!"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

# -----------------------------------------------
# Stage: cleanup - Limpeza automatica de Docker
# -----------------------------------------------
cleanup-docker:
  stage: cleanup
  tags:
    - shell
  script:
    - docker image prune -f --filter "until=72h"
    - docker builder prune -f --filter "until=72h"
    - Write-Host "Limpeza de imagens e cache antigos concluida"
    - docker system df
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  allow_failure: true
