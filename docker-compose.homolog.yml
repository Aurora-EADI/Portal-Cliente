services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: aurora-db-homolog
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_homolog:/var/lib/postgresql/data
    networks:
      - aurora-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # MinIO Service (Object Storage)
  minio:
    image: minio/minio:latest
    container_name: minio-homolog
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_homolog:/data
    command: server /data --console-address ":9001"
    restart: always
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 512M
    # MinIO Console accessible via Traefik if needed, for now kept internal or via port forwarding if debugging needed.
    # To expose console: add labels similar to frontend with Host(`minio.homologacao...`)

    # Backend Service (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod # Using Prod Dockerfile for Homologation
    container_name: portal-aurora-backend-homolog
    # Auto-migration command adapted for production build if needed, 
    # but Dockerfile.prod usually has CMD ["node", "dist/main"].
    # We can override valid for prod image:
    command: >
      sh -c "npx prisma migrate deploy --schema=prisma/postgres/schema.prisma &&
             node dist/src/main.js"
    environment:
      NODE_ENV: production # Behaves like prod
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_URL_POSTGRES: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_URL_SQLSERVER: ${DATABASE_URL_SQLSERVER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    volumes:
      - ./backend/prisma:/app/prisma # Needed for migration command
    # NO PORTS EXPOSED to host
    labels:
      - "traefik.enable=true"
      # Rule: Host is homologacao... AND PathPrefix /api
      - "traefik.http.routers.backend.rule=Host(`homologacao.auroraeadi.com.br`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - aurora-network
    depends_on:
      - db
      - minio
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./aurora-eadi-front
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    container_name: portal-aurora-frontend-homolog
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
    # NO PORTS EXPOSED to host
    labels:
      - "traefik.enable=true"
      # Rule: Host is homologacao... (Root)
      - "traefik.http.routers.frontend.rule=Host(`homologacao.auroraeadi.com.br`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - aurora-network
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.11
    container_name: traefik-homolog
    ports:
      - "80:80"
      # - "443:443" # Uncomment if using HTTPS
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.homolog.yml:/etc/traefik/traefik.yml:ro
    restart: always
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data_homolog:
  minio_data_homolog:
