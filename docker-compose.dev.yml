services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - aurora-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      # Usando o IP fixo da VM: 172.20.210.81
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@172.20.210.81:${DB_PORT}/${DB_NAME}
      DATABASE_URL_POSTGRES: postgresql://${DB_USER}:${DB_PASSWORD}@172.20.210.81:${DB_PORT}/${DB_NAME}
      DATABASE_URL_SQLSERVER: ${DATABASE_URL_SQLSERVER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.dev.local`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - aurora-network
    depends_on:
      - minio  
    restart: unless-stopped

  frontend:
    build:
      context: ./aurora-eadi-front
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./aurora-eadi-front:/app
      - /app/node_modules
      - /app/.next
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dev.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - aurora-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data: