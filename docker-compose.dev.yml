services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: aurora-db-dev
    ports:
      - "5432:5432"
      # Segunda porta porque a 5432 do host costuma estar ocupada por um
      # PostgreSQL nativo do Windows, e quem atende a conexao vira sorte.
      # Pela 5433 o container responde sem ambiguidade.
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aurora_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aurora-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./portal-cliente-api
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-backend
    # Nao roda "prisma:push" aqui: o schema do frontend e o superset (fonte de
    # verdade do dominio agendamento) e ja faz o push. Rodar push dos dois lados
    # entra em conflito (enums/colunas divergentes). So espera a tabela existir.
    command: >
      sh -c "npm run prisma:generate &&
             until npm run prisma:seed; do echo 'Aguardando schema (frontend ainda nao rodou db push)...'; sleep 2; done &&
             npm run dev"
    environment:
      NODE_ENV: development
      PORT: 5000
      # DB_PASSWORD_URLENC, nao DB_PASSWORD: a senha entra numa URL, e caractere
      # como "@" precisa vir percent-encoded (admin@123 -> admin%40123). Cru, a
      # URL vira postgresql://postgres:admin@123@db:5432/... e o parse quebra.
      # O servico db continua usando DB_PASSWORD cru em POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD_URLENC}@db:5432/${DB_NAME}
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD_URLENC}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Credencial das rotas /api/service/**, chamadas so pelo Portal Aurora.
      # Sem ela o ServiceKeyGuard falha fechado (503) em vez de liberar.
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-averbacao}
      # SMTP das notificacoes (procuracao decidida, documento decidido,
      # processo liberado). Sem HOST/USER/PASS o MailService sobe desligado e
      # so registra aviso no log — a API funciona igual, sem email.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      # false porque a 587 do Office 365 e STARTTLS; "true" so vale na 465.
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3002}
    volumes:
      - ./portal-cliente-api:/app
      - /app/node_modules
    ports:
      - "5001:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.dev.local`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - aurora-network
    depends_on:
      - db
      - minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  traefik:
    image: traefik:v3.1
    container_name: traefik-dev
    ports:
      - "8081:80" # HTTP traffic (different than prod)
      - "8082:8080" # Traefik Dashboard (different than prod)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-frontend
    command: >
      sh -c "npx prisma db push --accept-data-loss &&
             npx prisma generate &&
             npm run dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${API_URL}
      # Modulos novos (averbacao, procuracoes) falam com o portal-cliente-api.
      # E o valor visto pelo BROWSER, entao usa a porta publicada no host
      # (5001), nao a interna do container (5000).
      NEXT_PUBLIC_NEST_API_URL: ${NEST_API_URL:-http://localhost:5001/api}
      # DB_PASSWORD_URLENC, nao DB_PASSWORD: a senha entra numa URL, e caractere
      # como "@" precisa vir percent-encoded (admin@123 -> admin%40123). Cru, a
      # URL vira postgresql://postgres:admin@123@db:5432/... e o parse quebra.
      # O servico db continua usando DB_PASSWORD cru em POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD_URLENC}@db:5432/${DB_NAME}
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD_URLENC}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Desabilitar telemetria do Next.js
      NEXT_TELEMETRY_DISABLED: 1
      # Otimizações de memória do Node.js
      NODE_OPTIONS: --max-old-space-size=3072
      # Adicione para resolver o problema de memória com watchpack
      WATCHPACK_POLLING: true
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dev.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - aurora-network
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data:
