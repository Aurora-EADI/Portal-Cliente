services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:15-alpine
    container_name: aurora-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aurora_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aurora-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-backend
    command: >
      sh -c "npm run prisma:generate:pg &&
             npm run prisma:migrate:pg -- --name auto_startup &&
             npm run prisma:seed &&
             npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_URL_POSTGRES: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      DATABASE_URL_SQLSERVER: ${DATABASE_URL_SQLSERVER}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.dev.local`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - aurora-network
    depends_on:
      - db
      - minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  traefik:
    image: traefik:v3.1
    container_name: traefik-dev
    ports:
      - "8081:80" # HTTP traffic (different than prod)
      - "8082:8080" # Traefik Dashboard (different than prod)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped
    networks:
      - aurora-network
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./aurora-eadi-front
      dockerfile: Dockerfile.dev
    container_name: portal-aurora-frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${API_URL}
      # Desabilitar telemetria do Next.js
      NEXT_TELEMETRY_DISABLED: 1
      # Otimizações de memória do Node.js
      NODE_OPTIONS: --max-old-space-size=3072
      # Adicione para resolver o problema de memória com watchpack
      WATCHPACK_POLLING: true
    ports:
      - "3000:3000"
    volumes:
      - ./aurora-eadi-front:/app
      - /app/node_modules
      - /app/.next
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`dev.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - aurora-network
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  aurora-network:
    driver: bridge

volumes:
  postgres_data:
