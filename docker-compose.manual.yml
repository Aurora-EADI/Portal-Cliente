# Override para o primeiro deploy manual no SRVPORTALEADI.
# Os Dockerfiles usam arquivos da raiz do monorepo; portanto todos os builds
# mantêm context: ., em vez dos diretórios individuais dos serviços.
services:
  migrate:
    image: portal-cliente-migrator:manual
    build:
      context: .
      dockerfile: portal-cliente-api/Dockerfile
      target: migrator

  portal-cliente-api:
    image: portal-cliente-api:manual
    build:
      context: .
      dockerfile: portal-cliente-api/Dockerfile
      target: production

  frontend:
    image: portal-cliente-frontend:manual
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_NEST_API_URL: /api
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL}
        NEXT_PUBLIC_AVERBACAO_ATIVA: ${AVERBACAO_ATIVA:-false}
