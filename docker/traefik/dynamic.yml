http:
  routers:
    # Rotas HTTP (porta 80) - para acesso via IP
    frontend-router-http:
      rule: "Host(`172.20.210.84`)"
      service: frontend-service
      entryPoints:
        - web
      priority: 10

    backend-router-http:
      rule: "Host(`172.20.210.84`) && PathPrefix(`/api`)"
      service: backend-service
      entryPoints:
        - web
      priority: 20

    # Redirecionar domínio HTTP para HTTPS
    http-catchall:
      rule: "Host(`portal.local`) || Host(`portal.auroraeadi.com.br`)"
      entryPoints:
        - web
      middlewares:
        - redirect-to-https
      service: noop@internal

    # Rotas HTTPS (porta 443) - para acesso via domínio
    frontend-router:
      rule: "Host(`portal.local`) || Host(`portal.auroraeadi.com.br`)"
      service: frontend-service
      entryPoints:
        - websecure
      tls: {}

    backend-router:
      rule: "(Host(`api.portal.local`) || Host(`portal.local`) || Host(`portal.auroraeadi.com.br`)) && PathPrefix(`/api`)"
      service: backend-service
      entryPoints:
        - websecure
      tls: {}

    minio-router:
      rule: "Host(`minio.portal.auroraeadi.com.br`) || Host(`minio.portal.local`)"
      service: minio-service
      entryPoints:
        - websecure
      middlewares:
        - minio-headers
      tls: {}

    # Console do MinIO (opcional, para administração)
    minio-console-router:
      rule: "Host(`minio-console.portal.auroraeadi.com.br`) || Host(`minio-console.portal.local`)"
      service: minio-console-service
      entryPoints:
        - websecure
      tls: {}

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    minio-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
        customResponseHeaders:
          Access-Control-Allow-Origin: "*"

  services:
    frontend-service:
      loadBalancer:
        servers:
          - url: "http://portal-aurora-frontend-prod:3000"
    backend-service:
      loadBalancer:
        servers:
          - url: "http://portal-aurora-backend-prod:5000"
    minio-service:
      loadBalancer:
        servers:
          - url: "http://minio-prod:9000"
    minio-console-service:
      loadBalancer:
        servers:
          - url: "http://minio-prod:9001"

tls:
  certificates:
    - certFile: /etc/traefik/certificados/portal.crt
      keyFile: /etc/traefik/certificados/portal.key