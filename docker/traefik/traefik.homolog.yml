# Traefik estático da HOMOLOGAÇÃO do Portal do Cliente (VM 172.20.210.87).
#
# Este Traefik vive dentro da stack (ao contrário da produção, onde é externo e
# compartilhado). Escuta 80/443 dentro do container; o compose publica isso em
# 8090/8453 no host, porque 80 e 443 pertencem à homologação do Portal Aurora
# na mesma VM.

api:
  # Dashboard desligado: `insecure: true` exporia o painel na rede interna.
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          # `to` com porta, e não com o nome do entrypoint: `to: websecure`
          # redirecionaria para a 443 do host, que pertence ao Aurora homolog.
          # O Traefik v3 não tem campo `port` aqui (falha com "field not
          # found, node: port"). O valor tem de ser o mesmo HOMOLOG_HTTPS_PORT
          # publicado no compose.
          to: ":8453"
          scheme: https
          permanent: false

  websecure:
    address: ":443"

# Nenhum certificatesResolver: homologação usa certificado autoassinado,
# declarado pelo file provider abaixo. ACME exige porta 80 pública e domínio
# resolvível, e aqui o acesso é por IP numa rede interna.

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # Só containers desta stack. Sem a constraint o Traefik lê também as labels
    # da homologação do Aurora na mesma máquina e cria rotas para ela —
    # `network` abaixo NÃO restringe a descoberta, só escolhe a rede padrão.
    constraints: "Label(`com.docker.compose.project`,`portal-cliente-hml`)"
    network: portalcliente_hml
    watch: true
  file:
    filename: /etc/traefik/dynamic.homolog.yml
    watch: true

log:
  level: INFO
